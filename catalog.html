<div class="container mt-3 mb-5 catalog-container">
<div class="catalog-layout">
  <!-- Tournament picker as a sidebar on wide screens; below 900px it's
       hidden and the dropdown in the filter panel is used instead. Both
       drive the same selection (catalog.js). -->
  <aside class="tournament-sidebar" id="tournamentSidebar" aria-label="Tournaments">
    <div class="ts-head">
      <span class="field-label" style="margin:0;">Tournaments</span>
      <button type="button" class="custom-select-clear-btn" id="tsClearBtn">Clear</button>
    </div>
    <input type="search" class="custom-select-search" id="tsSearch" placeholder="Search tournaments…" autocomplete="off" aria-label="Search tournaments" />
    <div class="ts-summary" id="tsSummary">All tournaments</div>
    <div class="ts-list" id="tsList"></div>
  </aside>

  <div class="catalog-main">
  <h1>Catalog</h1>
  <p class="subtitle" id="resultCount">Loading…</p>

  <div class="panel" style="margin-bottom:20px;">
    <div style="margin-bottom:16px;">
      <span class="field-label">Search</span>
      <input type="search" id="searchBox" placeholder="Search question text, answers, or tournament…" style="width:100%; max-width: 520px;" />
    </div>

    <div class="grid-filters">
      <div>
        <span class="field-label">Subject</span>
        <div class="chip-row" id="subjectChips"></div>
      </div>
      <div>
        <span class="field-label">Round</span>
        <div class="dual-slider" id="roundSlider">
          <div class="track"></div>
          <div class="range-fill" id="roundSliderFill"></div>
          <input type="range" id="roundMin" min="1" max="17" value="1" step="1" />
          <input type="range" id="roundMax" min="1" max="17" value="17" step="1" />
        </div>
        <div class="round-range-label" id="roundRangeLabel">Rounds 1–17</div>
        <label class="filter-checkbox-label" style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:6px;">
          <input type="checkbox" id="includeUnlabeledRounds" checked /> Include unlabeled
        </label>
      </div>
      <div>
        <span class="field-label">Question type</span>
        <div class="chip-row" id="qtypeChips"></div>
      </div>
      <div>
        <span class="field-label">Format</span>
        <div class="chip-row" id="formatChips"></div>
      </div>
    </div>

    <div class="grid-filters" style="margin-top:16px;">
      <div>
        <span class="field-label">Level</span>
        <div class="chip-row" id="levelChips"></div>
      </div>
      <div>
        <span class="field-label">Visual questions</span>
        <div class="chip-row" id="visualChips"></div>
      </div>
      <div id="tournamentFilterCell">
        <span class="field-label">Tournament</span>
        <select id="tournamentSelect" style="width:100%;"></select>
      </div>
      <div style="align-self: end; display:flex; gap:8px;">
        <button class="btn btn-outline-secondary" id="clearFilters">Clear all filters</button>
      </div>
    </div>
  </div>

  <div id="results"></div>
  <div class="pagination" id="pagination"></div>
  </div>
</div>
</div>

<script src="js/catalog.js"></script>
</body>
</html>
