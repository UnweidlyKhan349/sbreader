<div class="container-xl mt-3 mb-5 pb-5">
  <div id="statsLoading" class="text-body-secondary">Loading…</div>
  <div id="statsLoggedOut" hidden>
    <p class="lead">Your stats</p>
    <p><a href="login">Log in</a> or <a href="signup">sign up</a> to keep stats on every question you answer in Play and Multiplayer.</p>
  </div>
  <div id="statsBody" hidden>
    <ul class="nav nav-underline user-nav mb-3" id="userNav">
      <li class="nav-item"><a class="nav-link" href="stats" data-page="stats" data-type="tossup">Tossup Stats</a></li>
      <li class="nav-item"><a class="nav-link" href="stats?type=bonus" data-page="stats" data-type="bonus">Bonus Stats</a></li>
      <li class="nav-item"><a class="nav-link" href="graphs" data-page="graphs" data-type="tossup">Tossup Graphs</a></li>
      <li class="nav-item"><a class="nav-link" href="graphs?type=bonus" data-page="graphs" data-type="bonus">Bonus Graphs</a></li>
    </ul>
    <form class="mb-3" id="form">
      <div class="row">
        <div class="col-12 col-md-6 mb-2">
          <select id="levels" aria-label="Levels">
            <option value="hs">High School</option>
            <option value="ms">Middle School</option>
          </select>
        </div>
        <div class="col-12 col-md-6 mb-2">
          <div class="input-group">
            <input type="text" class="form-control" id="set-name" placeholder="Set Name" list="set-list" autocomplete="off" aria-label="Set name" />
            <datalist id="set-list"></datalist>
            <button type="submit" class="btn btn-info">Submit</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="include-multiplayer" checked />
            <label class="form-check-label" for="include-multiplayer">Include multiplayer stats</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="include-singleplayer" checked />
            <label class="form-check-label" for="include-singleplayer">Include singleplayer stats</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="cumulative" />
            <label class="form-check-label" for="cumulative">Show cumulative view</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="filter" checked />
            <label class="form-check-label" for="filter">Exclude days with fewer than 5 data points</label>
          </div>
        </div>
        <div class="col-12 col-md-6 text-md-end">
          <div>
            <label for="start-date">Start Date (optional):</label>
            <input type="date" id="start-date" name="start-date" />
          </div>
          <div>
            <label for="end-date">End Date (optional):</label>
            <input type="date" id="end-date" name="end-date" />
          </div>
        </div>
      </div>
    </form>
    <div class="alert alert-danger" id="statsError" role="alert" hidden></div>
    <p class="text-body-secondary" id="graphNote" hidden></p>
    <div class="row mb-5"><div class="col-12"><canvas id="question-count" role="img" aria-label="Questions heard per day, by result"></canvas></div></div>
    <div class="row mb-5"><div class="col-12"><canvas id="ppq" role="img" aria-label="Points per question, per day"></canvas></div></div>
    <div class="row mb-5"><div class="col-12"><canvas id="result-per-question" role="img" aria-label="Share of questions answered right, and share missed, per day"></canvas></div></div>
    <div class="row mb-5" id="celerity-row"><div class="col-12"><canvas id="celerity" role="img" aria-label="Average celerity per day"></canvas></div></div>
  </div>
</div>
