<div class="container-xl mt-3 mb-5 pb-5">
  <div id="statsLoading" class="text-body-secondary">Loading…</div>
  <div id="statsLoggedOut" hidden>
    <p class="lead">Your stats</p>
    <p><a href="login">Log in</a> or <a href="signup">sign up</a> to keep stats on every question you answer in Play and Multiplayer.</p>
  </div>
  <div id="statsBody" hidden>
    <ul class="nav nav-underline user-nav mb-3" id="userNav">
      <li class="nav-item"><a class="nav-link" href="stats" data-page="stats">Stats</a></li>
      <li class="nav-item"><a class="nav-link" href="graphs" data-page="graphs">Graphs</a></li>
    </ul>
    <form class="mb-3" id="form">
      <div class="row">
        <div class="col-12 col-md-6 mb-2">
          <select id="levels" aria-label="Levels">
            <option value="hs">High School</option>
            <option value="ms">Middle School</option>
          </select>
        </div>
        <div class="col-12 col-md-6 mb-2">
          <div class="input-group">
            <input type="text" class="form-control" id="set-name" placeholder="Set Name" list="set-list" autocomplete="off" aria-label="Set name" />
            <datalist id="set-list"></datalist>
            <button type="submit" class="btn btn-info">Submit</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="include-tossups" checked />
            <label class="form-check-label" for="include-tossups">Include tossups</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="include-bonuses" checked />
            <label class="form-check-label" for="include-bonuses">Include bonuses</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="include-multiplayer" checked />
            <label class="form-check-label" for="include-multiplayer">Include multiplayer stats</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="include-singleplayer" checked />
            <label class="form-check-label" for="include-singleplayer">Include singleplayer stats</label>
          </div>
        </div>
        <div class="col-12 col-md-6 text-md-end">
          <div>
            <label for="start-date">Start Date (optional):</label>
            <input type="date" id="start-date" name="start-date" />
          </div>
          <div>
            <label for="end-date">End Date (optional):</label>
            <input type="date" id="end-date" name="end-date" />
          </div>
        </div>
      </div>
    </form>
    <div class="alert alert-danger" id="statsError" role="alert" hidden></div>
    <div class="d-flex justify-content-end mb-1">
      Download stats:
      <a class="ms-2 clickable link-primary" id="download-stats-csv" role="button" tabindex="0">CSV</a>
    </div>
    <ul class="nav nav-tabs mb-3" id="stats-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="subject-tab" data-tab="subject-tab-pane" type="button" role="tab" aria-controls="subject-tab-pane" aria-selected="false">Subject <span class="d-none d-md-inline">Stats</span></button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="format-tab" data-tab="format-tab-pane" type="button" role="tab" aria-controls="format-tab-pane" aria-selected="false">Format <span class="d-none d-md-inline">Stats</span></button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="level-tab" data-tab="level-tab-pane" type="button" role="tab" aria-controls="level-tab-pane" aria-selected="false">Level <span class="d-none d-md-inline">Stats</span></button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="set-tab" data-tab="set-tab-pane" type="button" role="tab" aria-controls="set-tab-pane" aria-selected="false">Set <span class="d-none d-md-inline">Stats</span></button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="best-buzz-tab" data-tab="best-buzz-tab-pane" type="button" role="tab" aria-controls="best-buzz-tab-pane" aria-selected="false">Best Buzz</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="recent-tab" data-tab="recent-tab-pane" type="button" role="tab" aria-controls="recent-tab-pane" aria-selected="false">Recent</button>
      </li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane table-responsive" id="subject-tab-pane" role="tabpanel" aria-labelledby="subject-tab" tabindex="0" hidden>
        <table class="table table-hover stats-table" id="subject-stats" data-label="Subject">
          <thead></thead>
          <tbody class="table-group-divider"></tbody>
          <tfoot class="table-group-divider"></tfoot>
        </table>
      </div>
      <div class="tab-pane table-responsive" id="format-tab-pane" role="tabpanel" aria-labelledby="format-tab" tabindex="0" hidden>
        <table class="table table-hover stats-table" id="format-stats" data-label="Format">
          <thead></thead>
          <tbody class="table-group-divider"></tbody>
          <tfoot class="table-group-divider"></tfoot>
        </table>
      </div>
      <div class="tab-pane table-responsive" id="level-tab-pane" role="tabpanel" aria-labelledby="level-tab" tabindex="0" hidden>
        <table class="table table-hover stats-table" id="level-stats" data-label="Level">
          <thead></thead>
          <tbody class="table-group-divider"></tbody>
          <tfoot class="table-group-divider"></tfoot>
        </table>
      </div>
      <div class="tab-pane table-responsive" id="set-tab-pane" role="tabpanel" aria-labelledby="set-tab" tabindex="0" hidden>
        <table class="table table-hover stats-table" id="set-stats" data-label="Set">
          <thead></thead>
          <tbody class="table-group-divider"></tbody>
          <tfoot class="table-group-divider"></tfoot>
        </table>
      </div>
      <div class="tab-pane" id="best-buzz-tab-pane" role="tabpanel" aria-labelledby="best-buzz-tab" tabindex="0" hidden>
        <div id="best-buzz"></div>
      </div>
      <div class="tab-pane" id="recent-tab-pane" role="tabpanel" aria-labelledby="recent-tab" tabindex="0" hidden>
        <div id="recent"></div>
      </div>
    </div>
  </div>
</div>
