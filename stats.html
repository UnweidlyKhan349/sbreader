<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBReader - User - Stats</title>
<meta name="description" content="Your SB Reader stats: accuracy by subject, question type and tournament." />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
<link rel="stylesheet" href="css/style.css" />
<script src="js/site.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#dfebfb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#333333" media="(prefers-color-scheme: dark)" />
<script src="js/data.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg" id="navbar">
  <div class="container-fluid">
    <a class="navbar-brand ms-1 py-0" id="logo" href="index.html"><span class="logo-prefix">SB</span><span class="logo-suffix">Reader</span></a>
    <button class="navbar-toggler" type="button" data-sb-collapse="navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <div class="navbar-nav me-auto mb-2 mb-lg-0" id="navbar-navigation">
        <a class="nav-link" href="solo.html">Play</a>
        <a class="nav-link" href="multiplayer.html">Multiplayer</a>
        <div class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="catalog.html" role="button" data-sb-dropdown>Database</a>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="catalog.html">Search</a>
            <a class="dropdown-item" href="set-list.html">Set List</a>
          </div>
        </div>
        <a class="nav-link" href="about.html">About</a>
      </div>
      <div class="navbar-nav flex-row align-items-lg-center mb-2 mb-lg-0">
        <div class="nav-item dropdown">
          <button class="btn btn-link nav-link dropdown-toggle d-flex align-items-center" type="button" id="bd-theme" data-sb-dropdown aria-haspopup="menu" aria-label="Toggle theme">
            <span class="theme-icon-active"></span><span class="d-lg-none ms-2">Toggle theme</span>
          </button>
          <div class="dropdown-menu dropdown-menu-end">
            <button type="button" class="dropdown-item" data-sb-theme-value="light">Light</button>
            <button type="button" class="dropdown-item" data-sb-theme-value="dark">Night</button>
            <button type="button" class="dropdown-item" data-sb-theme-value="auto">Auto</button>
          </div>
        </div>
        <div class="vr d-none d-lg-flex mx-lg-2"></div>
        <div class="nav-item" id="navAccount"><a class="nav-link ms-3 ms-lg-0" href="account.html" id="login-link">Log in</a></div>
      </div>
    </div>
  </div>
</nav>

<div class="container-xl mt-3 mb-5">
  <div id="statsLoading" class="text-body-secondary">Loading…</div>
  <div id="statsLoggedOut" hidden>
    <p class="lead">Your stats</p>
    <p><a href="account.html">Log in or sign up</a> to keep stats on every question you answer in Play and Multiplayer.</p>
  </div>
  <div id="statsBody" hidden>
    <p class="lead">Your stats</p>
    <p id="statsSummary"></p>
    <div class="row g-4">
      <div class="col-12 col-lg-6"><h5>By subject</h5><div class="table-responsive"><table class="table table-sm table-striped" id="bySubject"></table></div></div>
      <div class="col-12 col-lg-6"><h5>By question type</h5><div class="table-responsive"><table class="table table-sm table-striped" id="byQtype"></table></div>
        <h5 class="mt-3">By mode</h5><div class="table-responsive"><table class="table table-sm table-striped" id="byMode"></table></div></div>
      <div class="col-12"><h5>By tournament</h5><div class="table-responsive stats-scroll"><table class="table table-sm table-striped" id="byTournament"></table></div></div>
    </div>
    <h5 class="mt-4">Recent answers</h5>
    <div id="recent"></div>
    <div class="mt-4"><button class="btn btn-outline-danger" type="button" id="resetStatsBtn">Reset stats</button></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/account-core.js"></script>
<script src="js/account.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
