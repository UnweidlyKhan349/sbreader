<div class="container-fluid mt-3 mb-5 pb-5 px-xxl-5">
  <div class="row">
    <!-- Settings, as on QB Reader's play page: beside the question on wide
         screens, above it (folded to just the timer) on narrow ones. -->
    <div class="col-12 col-lg-3 order-lg-1 mb-5 play-sidebar" id="settings">
      <div class="timer d-block p-1 text-center" id="timer"><span class="face" id="timerFace">0</span><span class="fraction" id="timerFraction">.0</span></div>
      <hr>
      <label class="form-check-label mb-1" for="setMode">Choose a mode:</label>
      <select class="form-select mb-2" id="setMode">
        <option value="set">Select by Set Name</option>
        <option value="random" selected>Random Questions</option>
        <option value="starred">Starred Questions</option>
      </select>
      <div class="d-none" id="setSettings">
        <input class="form-control" id="setName" type="text" placeholder="Set Name" list="setNameList" autocomplete="off" aria-label="Set name" />
        <datalist id="setNameList"></datalist>
        <input class="form-control my-1" id="packetNumbers" type="text" placeholder="Packet Numbers" autocomplete="off" aria-label="Packet numbers, e.g. 1-3, 5" />
        <div class="form-text mb-2" id="setInfo"></div>
      </div>
      <div class="d-none" id="starredSettings">
        <p class="mb-2" id="starredInfo">Star questions to practice them here.</p>
      </div>
      <div id="randomSettings">
        <div class="mb-2"><select id="tournamentSelect" aria-label="Tournaments"></select></div>
        <div id="roundRangeLabel">Rounds 1-17</div>
        <div class="dual-slider" id="roundSlider">
          <div class="track"></div>
          <div class="range-fill" id="roundSliderFill"></div>
          <input type="range" id="roundMin" min="1" max="17" value="1" step="1" aria-label="Lowest round" />
          <input type="range" id="roundMax" min="1" max="17" value="17" step="1" aria-label="Highest round" />
        </div>
      </div>
      <div class="mt-2" id="generalSettings">
        <div class="mb-2" id="subjectButtons"></div>
        <div class="form-check form-switch">
          <input class="form-check-input" id="toggleRebuzz" type="checkbox" role="switch" />
          <label class="form-check-label" for="toggleRebuzz">Allow rebuzzes</label>
        </div>
        <hr>
        <div class="form-check form-switch">
          <input class="form-check-input" id="toggleShowHistory" type="checkbox" role="switch" checked />
          <label class="form-check-label" for="toggleShowHistory">Show question history</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" id="toggleShowSetName" type="checkbox" role="switch" checked />
          <label class="form-check-label" for="toggleShowSetName">Show set name</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" id="toggleTimer" type="checkbox" role="switch" checked />
          <label class="form-check-label" for="toggleTimer">Enable timer</label>
        </div>
        <div class="mb-2"></div>
        <label for="rateSlider">Reading speed: <span id="rateValue">1.0×</span><br></label>
        <input class="form-range" id="rateSlider" type="range" min="0.5" max="2.5" step="0.1" value="1" />
        <div class="small-note" id="matchCount"></div>
        <div class="d-none d-lg-block">
          <hr>
          <p>
            <span class="text-nowrap"><kbd>k</kbd> = show/hide last question</span><br>
            <span class="text-nowrap"><kbd>t</kbd> = star/unstar last question</span><br>
            <span class="text-nowrap"><kbd>q</kbd> = I was wrong / I was right</span><br>
          </p>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-9" id="content">
      <div class="input-group d-none my-2" id="answerRow">
        <input class="form-control" type="text" id="answerInput" placeholder="Enter answer" autocomplete="off" aria-label="Your answer" />
        <button class="btn btn-success" id="submitAnswerBtn" type="button">Submit</button>
      </div>
      <div class="d-flex justify-content-between">
        <span id="statline">0/0 with 0 questions seen</span>
        <span class="ps-5 me-lg-2 text-end" id="questionMetadata">
          <span class="badge text-bg-warning me-1" id="pauseBadge" style="display:none;">Paused</span>
          <b id="questionInfo"></b>
        </span>
      </div>
      <div class="mt-2 question-panel" id="questionPanel">
        <div class="status-pill" id="statusPill" style="display:none;"></div>
        <div class="reveal-tags" id="revealTags">
          <span class="tag" id="revealSubjectTag"></span>
          <span class="tag" id="revealFormatTag"></span>
          <span class="tag" id="revealQtypeTag"></span>
        </div>
        <div class="reveal-measure-wrap" id="revealMeasureWrap">
          <div class="q-display" id="qDisplay"></div>
          <div class="q-figures" id="qFigures" style="display:none;"></div>
          <div class="choices-display" id="choicesDisplay" style="display:none;">
            <div class="choice-box" data-letter="W"><span class="letter">W)</span><span class="choice-text" id="choiceTextW"></span></div>
            <div class="choice-box" data-letter="X"><span class="letter">X)</span><span class="choice-text" id="choiceTextX"></span></div>
            <div class="choice-box" data-letter="Y"><span class="letter">Y)</span><span class="choice-text" id="choiceTextY"></span></div>
            <div class="choice-box" data-letter="Z"><span class="letter">Z)</span><span class="choice-text" id="choiceTextZ"></span></div>
          </div>
        </div>
      </div>
      <a class="mt-1 mt-lg-3 p-0 btn btn-link float-end d-none" id="overrideBtn" title="Shortcut: q">I was wrong</a>
      <div class="mt-1 mt-lg-3 reveal-box" id="revealBox" style="display:none;"></div>
      <ul class="room-history list-unstyled" id="questionLog"></ul>
    </div>
  </div>
</div>

<div class="container-fluid py-3 px-xxl-5 position-fixed bottom-0 bg-body play-buttons">
  <div class="row">
    <div class="col-12 col-lg-9" id="buttons">
      <button class="btn btn-primary" id="nextBtn" type="button" title="Shortcut: n">Next</button>
      <button class="btn btn-primary" id="pauseBtn" type="button" title="Shortcut: p" aria-label="Pause" disabled></button>
      <button class="btn btn-danger" id="settingsBtn" type="button" title="Shortcut: e" aria-label="Show or hide settings" aria-controls="settings"></button>
      <button class="btn btn-primary float-end" id="buzzBtn" type="button" title="Shortcut: space" disabled>Buzz</button>
    </div>
  </div>
</div>
