# Publishes the site to https://sbreader.org/ with this repo's own GitHub
# Pages (Settings -> Pages: Source "GitHub Actions", custom domain
# sbreader.org; see README, Deploying). The old project address,
# https://unweidlykhan349.github.io/sbreader/, redirects there by itself.
#
# It waits for CI (ci.yml: the unit and browser tests) to pass on a push to
# main, and deploys exactly the commit CI tested; a failed CI run deploys
# nothing. Running it by hand (workflow_dispatch) deploys main as it is,
# after the unit tests.
name: Deploy to sbreader.org

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a deploy still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Only after CI passed on a push to main (not a pull request from a
    # branch that happens to be called main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The commit CI tested (a workflow_run's own github.sha is just main's
      # tip, which may be newer); by hand, main's tip.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # If main has moved on since (CI runs can finish out of order), this
      # older commit isn't deployed: the newer push's CI deploys its own.
      - name: Still main's latest commit?
        if: github.event_name == 'workflow_run'
        run: |
          tip=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "::notice::main is now at $tip; skipping the deploy of $DEPLOY_SHA."
            echo "STALE=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.STALE != '1'
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        if: env.STALE != '1'
        run: node --test tests/*.test.js
      - name: Copy the site files
        if: env.STALE != '1'
        # Only what the site serves: not the repo's own files (docs, tests,
        # tools, the schema, the README and changelog, which pages link on
        # GitHub), nor the data only npm test reads. LICENSE stays with the copy.
        run: >-
          rsync -a
          --exclude .git --exclude .github --exclude .gitignore
          --exclude tests --exclude tools --exclude supabase --exclude docs
          --exclude README.md --exclude CHANGELOG.md --exclude package.json --exclude package-lock.json
          --exclude data/source-subjects.json --exclude data/subject-overrides.json
          ./ "$RUNNER_TEMP/site/"
      - name: Build a page for every set and packet, and the full sitemap
        if: env.STALE != '1'
        run: node tools/build-pages.js "$RUNNER_TEMP/site"
      - name: Stamp this deploy's version, so open tabs pick it up
        if: env.STALE != '1'
        run: node tools/stamp-version.js "$RUNNER_TEMP/site" "${{ env.DEPLOY_SHA }}"
      - uses: actions/configure-pages@v5
        if: env.STALE != '1'
      - uses: actions/upload-pages-artifact@v3
        if: env.STALE != '1'
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        if: env.STALE != '1'
        uses: actions/deploy-pages@v4
