name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js tests/*.js; do node --check "$f"; done
      - name: Tests (grader, multiplayer rules, data shape)
        run: node --test tests/*.test.js
