<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookmarks · SB Reader</title>
<link rel="stylesheet" href="css/style.css" />
<!-- Start the question bank download while the page and its scripts load,
     instead of waiting for data.js to run (the fetch() there reuses it). -->
<link rel="preload" href="data/questions.json" as="fetch" crossorigin />
<link rel="preload" href="data/meta.json" as="fetch" crossorigin />
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#0f1420" />
</head>
<body>
<div id="pageScroll">
<nav class="nav">
  <div class="brand"><img class="logo" src="img/logo.svg" alt="" width="24" height="24" /> SB Reader</div>
  <a class="navlink" href="index.html">Home</a>
  <a class="navlink" href="catalog.html">Catalog</a>
  <a class="navlink" href="solo.html">Solo Practice</a>
  <a class="navlink" href="multiplayer.html">Multiplayer</a>
  <div class="spacer"></div>
  <a class="navlink active" href="bookmarks.html">Bookmarked questions</a>
</nav>

<div class="container">
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
    <h1 style="margin:0;">Bookmarked questions</h1>
    <button class="btn primary" id="practiceBtn" style="padding:12px 20px;">Practice these</button>
  </div>
  <p class="subtitle" id="resultCount">Loading…</p>

  <div id="results"></div>
</div>
</div>

<script src="js/data.js"></script>
<script src="js/bookmarks.js"></script>
</body>
</html>
