<div class="container-xl mt-3 mb-5 pb-5">
  <p class="lead">Set List</p>
  <p id="setListSummary">Loading…</p>
  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <input type="search" class="form-control" id="setListFilter" placeholder="Filter by name" aria-label="Filter tournaments by name" autocomplete="off" />
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr><th scope="col">Tournament</th><th scope="col">Level</th><th scope="col">Date</th><th scope="col" class="text-end">Questions</th></tr>
      </thead>
      <tbody id="setListBody"></tbody>
    </table>
  </div>
</div>

<script src="js/data.js"></script>
<script>
  (function () {
    const LEVELS = { hs: 'High School', ms: 'Middle School' };
    const body = document.getElementById('setListBody');
    const filter = document.getElementById('setListFilter');
    let rows = [];

    function monthYear(date) {
      if (!date) return '';
      const [y, m] = date.split('-').map(Number);
      return m ? new Date(y, m - 1, 1).toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : String(y);
    }
    function render() {
      const q = filter.value.trim().toLowerCase();
      body.innerHTML = '';
      rows.filter((t) => !q || t.name.toLowerCase().includes(q)).forEach((t) => {
        const tr = document.createElement('tr');
        const name = document.createElement('td');
        const a = document.createElement('a');
        a.href = 'catalog.html?tournament=' + encodeURIComponent(t.slug);
        a.textContent = t.name;
        name.appendChild(a);
        const level = document.createElement('td');
        level.textContent = LEVELS[t.level] || t.level || '';
        const date = document.createElement('td');
        date.textContent = monthYear(t.date);
        const count = document.createElement('td');
        count.className = 'text-end';
        count.textContent = t.count.toLocaleString();
        tr.append(name, level, date, count);
        body.appendChild(tr);
      });
    }

    SBData.loadMeta().then(() => {
      const meta = SBData.meta;
      // Newest first; undated sets last, A-Z.
      rows = meta.tournaments.slice().sort((a, b) => {
        if (a.date && b.date && a.date !== b.date) return b.date.localeCompare(a.date);
        if (!!a.date !== !!b.date) return a.date ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      document.getElementById('setListSummary').textContent =
        `${rows.length} tournaments and ${meta.totalQuestions.toLocaleString()} questions, newest first. Click a tournament to search its questions. Dates are approximate.`;
      render();
    }).catch(() => {
      document.getElementById('setListSummary').textContent = 'Could not load the question bank. Try refreshing.';
    });
    filter.addEventListener('input', render);
  })();
</script>
<script src="js/config.js"></script>
